        - { name: choiceGroupId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateChoiceGroup' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/ChoiceGroup' } }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Rules]
      summary: "Delete a group (DRAFT sessions only)"
      description: "Permission: `academic:manage`."
      parameters:
        - { name: choiceGroupId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /grade-offerings/{gradeOfferingId}/constraints:
    get:
      tags: [Rules]
      summary: "REQUIRES / EXCLUDES rules of a grade offering"
      description: "Permission: `academic:view`."
      parameters:
        - { name: gradeOfferingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: array, items: { $ref: '#/components/schemas/Constraint' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Rules]
      summary: "Add \"A requires B\" or \"A excludes B\""
      description: "Permission: `academic:manage`."
      parameters:
        - { name: gradeOfferingId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConstraint' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Constraint' } }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /constraints/{constraintId}:
    delete:
      tags: [Rules]
      summary: "Remove a rule"
      description: "Permission: `academic:manage`."
      parameters:
        - { name: constraintId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /academic-programmes:
    get:
      tags: [Rules]
      summary: "Programmes of a session (?academicSessionId= required, ?locationId=)"
      description: "Permission: `academic:view`."
      parameters:
        - { name: academicSessionId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: locationId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: array, items: { $ref: '#/components/schemas/Programme' } } }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Rules]
      summary: "Add a stream or a flexible combination"
      description: "Permission: `academic:manage`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProgramme' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Programme' } }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /academic-programmes/{programmeId}:
    get:
      tags: [Rules]
      summary: "One programme"
      description: "Permission: `academic:view`."
      parameters:
        - { name: programmeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Programme' } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Rules]
      summary: "Edit or (de)activate a programme"
      description: "Permission: `academic:manage`."
      parameters:
        - { name: programmeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProgramme' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Programme' } }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Rules]
      summary: "Delete a programme (DRAFT sessions only)"
      description: "Permission: `academic:manage`."
      parameters:
        - { name: programmeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /academic-context:
    get:
      tags: [Context]
      summary: "Grades at a location, or (with gradeId) the whole tree for one grade — the downstream contract"
      description: "Permission: `academic:view`."
      parameters:
        - { name: academicSessionId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: locationId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: gradeId, in: query, required: false, description: Master grade id; omit to list the grades offered, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/AcademicContext' } }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sv_access
      description: httpOnly access-token cookie set by /auth/login or /auth/signup.
  parameters:
    SchoolId: { name: schoolId, in: path, required: true, schema: { type: string, format: uuid } }
    LocationId: { name: locationId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Session:
      description: The signed-in session
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Session' }
    School:
      description: The school
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/School' }
    Location:
      description: The location
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/LocationDetail' }
    Unauthenticated:
      description: UNAUTHENTICATED / SESSION_EXPIRED / INVALID_CREDENTIALS
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    Forbidden:
      description: FORBIDDEN. The permission is missing; details.required lists it.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    NotFound:
      description: NOT_FOUND. Also returned for another tenant's ids.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    Validation:
      description: VALIDATION_FAILED with details.fields (dotted paths, e.g. address.postalCode)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    Conflict:
      description: A business rule refused the change (see the error code)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
    RateLimited:
      description: RATE_LIMITED
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } }
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable catalog code (see CONTRACTS.md)
              example: LOCATION_CODE_TAKEN
            message: { type: string, example: Location code MOH is already in use. }
            details:
              type: object
              additionalProperties: true
              properties:
                fields: { type: object, additionalProperties: { type: string } }
                dependencies:
                  type: array
                  items: { $ref: '#/components/schemas/Dependency' }
            requestId: { type: string }
    Dependency:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        count: { type: integer }
        message: { type: string, example: 12 active staff members are assigned to this location. }
    Session:
      type: object
      properties:
        user:
          type: object
          properties:
            userId: { type: string, format: uuid }
            email: { type: string }
            fullName: { type: string }
            role: { type: string, enum: [SCHOOL_ADMIN, FACULTY, STAFF, PARENT] }
        tenant:
          type: object
          properties:
            tenantId: { type: string, format: uuid }
            name: { type: string }
        permissions: { type: array, items: { type: string } }
    SchoolInput:
      type: object
      properties:
        schoolCode: { type: string, example: GPS }
        legalName: { type: string }
        displayName: { type: string }
        shortName: { type: string, nullable: true }
        primaryEmail: { type: string, format: email }
        primaryPhone: { type: string, example: '+91 98140 11000' }
        alternatePhone: { type: string, nullable: true }
        websiteUrl: { type: string, nullable: true }
        defaultTimezone: { type: string, example: Asia/Kolkata }
        defaultCurrency: { type: string, example: INR }
        defaultLocale: { type: string, example: en-IN }
    School:
      type: object
      properties:
        schoolId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        schoolCode: { type: string }
        legalName: { type: string }
        displayName: { type: string }
        shortName: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        primaryEmail: { type: string }
        primaryPhone: { type: string, description: E.164 }
        alternatePhone: { type: string, nullable: true }
        websiteUrl: { type: string, nullable: true }
        defaultTimezone: { type: string }
        defaultCurrency: { type: string }
        defaultLocale: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE, ARCHIVED] }
        setupCompleted: { type: boolean }
        setup:
          type: object
          description: Only with `school:view_config`
          properties:
            status: { type: string, enum: [IN_PROGRESS, COMPLETED] }
            currentStep: { type: integer }
            completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IdentifierInput:
      type: object
      properties:
        identifierType: { type: string, example: Affiliation Number }
        identifierValue: { type: string }
        issuingAuthority: { type: string, nullable: true }
        issueDate: { type: string, format: date, nullable: true }
        expiryDate: { type: string, format: date, nullable: true }
        documentUrl: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, EXPIRED, SUPERSEDED] }
    Identifier:
      allOf:
        - $ref: '#/components/schemas/IdentifierInput'
        - type: object
          properties:
            identifierId: { type: string, format: uuid }
            schoolId: { type: string, format: uuid }
    Address:
      type: object
      properties:
        line1: { type: string, nullable: true }
        line2: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        city: { type: string, nullable: true }
        district: { type: string, nullable: true }
        state: { type: string, nullable: true }
        postalCode: { type: string, nullable: true, description: Country-aware (IN 6-digit PIN, US ZIP, GB, CA, AU, SG, generic) }
        country: { type: string, default: IN, description: ISO 3166-1 alpha-2 }
    CreateLocation:
      type: object
      required: [displayName, locationCode, locationType]
      properties:
        displayName: { type: string, example: Mohali Campus }
        locationCode: { type: string, example: MOH, description: '2–10 of A-Z 0-9 -, saved in capitals, unique per school' }
        locationType: { type: string, enum: [MAIN_CAMPUS, BRANCH_CAMPUS, ADMINISTRATIVE] }
        intent: { type: string, enum: [DRAFT, ACTIVE], default: DRAFT }
        isPrimary: { type: boolean, default: false, description: Only valid with intent ACTIVE }
        officialName: { type: string, nullable: true }
        openingDate: { type: string, format: date, nullable: true }
        timezoneOverride: { type: string, nullable: true, description: null = inherit the school default }
        currencyOverride: { type: string, nullable: true }
        localeOverride: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        alternatePhone: { type: string, nullable: true }
        websiteUrl: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        notes: { type: string, nullable: true }
        address: { $ref: '#/components/schemas/Address' }
    UpdateLocation:
      type: object
      description: Any subset of the CreateLocation fields except `intent` and `isPrimary`.
      properties:
        displayName: { type: string }
        locationCode: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { $ref: '#/components/schemas/Address' }
    Location:
      type: object
      properties:
        locationId: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        locationCode: { type: string }
        displayName: { type: string }
        officialName: { type: string, nullable: true }
        locationType: { type: string, enum: [MAIN_CAMPUS, BRANCH_CAMPUS, ADMINISTRATIVE] }
        isPrimary: { type: boolean }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE, ARCHIVED] }
        openingDate: { type: string, nullable: true }
        timezoneOverride: { type: string, nullable: true }
        currencyOverride: { type: string, nullable: true }
        localeOverride: { type: string, nullable: true }
        effectiveDefaults:
          type: object
          properties:
            timezone: { type: string }
            currency: { type: string }
            locale: { type: string }
            inherited:
              type: object
              properties:
                timezone: { type: boolean }
                currency: { type: boolean }
                locale: { type: boolean }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        alternatePhone: { type: string, nullable: true }
        websiteUrl: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        address: { $ref: '#/components/schemas/Address' }
        staffCount: { type: integer, nullable: true, description: null until the Staff module exists }
        studentCount: { type: integer, nullable: true, description: null until the Student module exists }
        notes: { type: string, nullable: true, description: Only with `location:view_config` }
        statusChangedAt: { type: string, format: date-time, nullable: true }
        archivedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LocationDetail:
      allOf:
        - $ref: '#/components/schemas/Location'
        - type: object
          properties:
            codeLocked: { type: boolean, description: Downstream records reference the location, so the code cannot change }
            deletable: { type: boolean, description: Only an unreferenced DRAFT can be deleted }
    LocationList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Location' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        facets:
          type: object
          properties:
            cities:
              type: array
              items:
                type: object
                properties:
                  city: { type: string }
                  count: { type: integer }
            statuses: { type: object, additionalProperties: { type: integer } }
            types: { type: object, additionalProperties: { type: integer } }
    CodeAvailability:
      type: object
      properties:
        code: { type: string, nullable: true }
        valid: { type: boolean }
        available: { type: boolean }
        message: { type: string, nullable: true }
        suggestion: { type: string, nullable: true }
    AuditEvent:
      type: object
      properties:
        auditEventId: { type: string, format: uuid }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        action: { type: string, example: location.primary_set }
        actor:
          type: object
          properties:
            userId: { type: string, nullable: true }
            role: { type: string }
            name: { type: string, nullable: true }
        changes:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              from: {}
              to: {}
        metadata: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }
        requestId: { type: string, nullable: true }
    SetupItem:
      type: object
      properties:
        key: { type: string, example: primary_location }
        label: { type: string }
        description: { type: string }
        status: { type: string, enum: [completed, pending, upcoming] }
        weight: { type: integer }
        module: { type: string }
        href: { type: string, nullable: true }
    SetupStatus:
      type: object
      properties:
        schoolId: { type: string, format: uuid }
        setupStatus: { type: string, enum: [IN_PROGRESS, COMPLETED] }
        currentStep: { type: integer }
        completionPercent: { type: integer, description: Overall, including modules that are not built yet }
        coreCompletionPercent: { type: integer, description: This module's own items only }
        items: { type: array, items: { $ref: '#/components/schemas/SetupItem' } }
        nextStep: { allOf: [{ $ref: '#/components/schemas/SetupItem' }], nullable: true }
        summary:
          type: object
          properties:
            schoolName: { type: string }
            primaryLocation:
              type: object
              nullable: true
              properties:
                locationId: { type: string, format: uuid }
                displayName: { type: string }
                locationCode: { type: string }
            activeLocations: { type: integer }
            draftLocations: { type: integer }
            totalLocations: { type: integer }
    MasterSchoolContext:
      type: object
      properties:
        schoolId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        displayName: { type: string }
        shortName: { type: string, nullable: true }
        defaults:
          type: object
          properties:
            timezone: { type: string }
            currency: { type: string }
            locale: { type: string }
        primaryLocationId: { type: string, format: uuid, nullable: true }
        setupCompleted: { type: boolean }
    MasterLocation:
      type: object
      description: Frozen. Store `locationId`; never copy the other fields.
      properties:
        locationId: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        locationCode: { type: string }
        displayName: { type: string }
        locationType: { type: string, enum: [MAIN_CAMPUS, BRANCH_CAMPUS, ADMINISTRATIVE] }
        status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE, ARCHIVED] }
        isPrimary: { type: boolean }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        country: { type: string, nullable: true }
        effectiveDefaults:
          type: object
          properties:
            timezone: { type: string }
            currency: { type: string }
            locale: { type: string }
    LocationValidation:
      type: object
      properties:
        purpose: { type: string, enum: [NEW_ASSIGNMENT, HISTORICAL_READ] }
        allValid: { type: boolean }
        results:
          type: array
          items:
            type: object
            properties:
              locationId: { type: string }
              valid: { type: boolean }
              reason: { type: string, enum: [NOT_FOUND, NOT_ACTIVE, ARCHIVED], nullable: true }
    Board:
      type: object
      properties:
        boardId: { type: string, format: uuid }
        boardCode: { type: string, example: CBSE }
        boardName: { type: string }
        boardType: { type: string, enum: [CENTRAL, STATE, OTHER] }
        stateCode: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        isSystem: { type: boolean, description: Built-in boards are shared by every school and read-only }
    RuleVersion:
      type: object
      properties:
        ruleVersionId: { type: string, format: uuid }
        boardId: { type: string, format: uuid }
        name: { type: string, example: 2026-27 }
        effectiveFrom: { type: string, format: date, nullable: true }
        effectiveTo: { type: string, format: date, nullable: true }
        sourceReference: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED, RETIRED] }
        isSystem: { type: boolean }
    GradeMaster:
      type: object
      properties:
        gradeId: { type: string, format: uuid }
        canonicalCode: { type: string, example: G08 }
        canonicalName: { type: string }
        shortCode: { type: string }
        sequenceNumber: { type: integer }
        educationStage: { type: string, enum: [FOUNDATIONAL, PREPARATORY, MIDDLE, SECONDARY] }
        isPrePrimary: { type: boolean }
        isBoardGrade: { type: boolean }
    Subject:
      type: object
      properties:
        subjectId: { type: string, format: uuid }
        subjectCode: { type: string }
        name: { type: string }
        shortName: { type: string, nullable: true }
        category: { type: string, enum: [LANGUAGE, MATHEMATICS, SCIENCE, SOCIAL_SCIENCE, COMMERCE, HUMANITIES, TECHNOLOGY, ARTS, PHYSICAL_EDUCATION, SKILL, OTHER] }
        languageCode: { type: string, nullable: true }
        hasTheory: { type: boolean }
        hasPractical: { type: boolean }
        hasProject: { type: boolean }
        hasInternalAssessment: { type: boolean }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        boardCodes:
          type: array
          items:
            type: object
            properties:
              definitionId: { type: string, format: uuid }
              boardRuleVersionId: { type: string, format: uuid }
              boardCode: { type: string, nullable: true }
              ruleVersionName: { type: string, nullable: true }
              boardSubjectCode: { type: string }
              boardSubjectName: { type: string, nullable: true }
    SubjectPage:
      type: object
      properties:
        data:
          type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Subject' } }
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
    AcademicSession:
      type: object
      description: Frozen. Store `academicSessionId`, never the name or code.
      properties:
        academicSessionId: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string, example: 2026-27 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [DRAFT, PUBLISHED, ACTIVE, CLOSED, ARCHIVED] }
        isCurrent: { type: boolean, description: True for the one ACTIVE session }
        locations:
          type: array
          items:
            type: object
            properties:
              locationId: { type: string, format: uuid }
              locationCode: { type: string, nullable: true }
              locationName: { type: string, nullable: true }
              boardId: { type: string, format: uuid }
              boardCode: { type: string, nullable: true }
              boardRuleVersionId: { type: string, format: uuid }
              ruleVersionName: { type: string, nullable: true }
              affiliationNumber: { type: string, nullable: true }
        previousSessionId: { type: string, format: uuid, nullable: true }
        warnings: { type: array, items: { type: object } }
        deletable: { type: boolean }
        lastValidation: { type: object, nullable: true, description: Only with academic:view_config }
    GradeOffering:
      type: object
      description: Frozen. A grade as taught at one location in one session. Store `gradeOfferingId`.
      properties:
        gradeOfferingId: { type: string, format: uuid }
        academicSessionId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        gradeId: { type: string, format: uuid }
        canonicalCode: { type: string }
        displayName: { type: string }
        displayCode: { type: string }
        medium: { type: string, nullable: true }
        capacity: { type: integer, nullable: true }
        sequenceOrder: { type: integer }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        sectionCount: { type: integer }
        subjectCount: { type: integer }
    SectionOffering:
      type: object
      description: Frozen. Store `sectionOfferingId`.
      properties:
        sectionOfferingId: { type: string, format: uuid }
        gradeOfferingId: { type: string, format: uuid }
        academicSessionId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        sectionCode: { type: string }
        displayName: { type: string }
        capacity: { type: integer, nullable: true }
        sequenceOrder: { type: integer }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    SubjectOffering:
      type: object
      description: Frozen. Store `subjectOfferingId`.
      properties:
        subjectOfferingId: { type: string, format: uuid }
        gradeOfferingId: { type: string, format: uuid }
        academicSessionId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        subjectCode: { type: string }
        subjectName: { type: string }
        category: { type: string }
        offeringType: { type: string, enum: [MANDATORY, ELECTIVE, OPTIONAL_ADDITIONAL, LANGUAGE, SKILL, INTERNAL] }
        boardSubjectDefinitionId: { type: string, format: uuid, nullable: true }
        boardSubjectCode: { type: string, nullable: true }
        boardSubjectName: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    CopySubjectsResult:
      type: object
      properties:
        data:
          type: object
          properties:
            created: { type: array, items: { $ref: '#/components/schemas/SubjectOffering' } }
            skipped: { type: integer }
    Term:
      type: object
      properties:
        termId: { type: string, format: uuid }
        academicSessionId: { type: string, format: uuid }
        locationId: { type: string, format: uuid, nullable: true, description: null = every location in the session }
        name: { type: string }
        code: { type: string }
        type: { type: string, enum: [TERM, SEMESTER, QUARTER, ANNUAL, CUSTOM] }
        sequence: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [planned, current, closed], description: Computed from today's date in the school time zone }
    ChoiceGroup:
      type: object
      properties:
        choiceGroupId: { type: string, format: uuid }
        gradeOfferingId: { type: string, format: uuid }
        academicSessionId: { type: string, format: uuid }
        name: { type: string }
        ruleType: { type: string, enum: [REQUIRED_ALL, CHOOSE_ONE, CHOOSE_N, OPTIONAL] }
        min: { type: integer }
        max: { type: integer }
        sequence: { type: integer }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        subjects: { type: array, items: { type: object } }
        summary: { type: string, example: Choose 1 of Punjabi, Hindi, Urdu }
    Constraint:
      type: object
      properties:
        constraintId: { type: string, format: uuid }
        gradeOfferingId: { type: string, format: uuid }
        academicSessionId: { type: string, format: uuid }
        type: { type: string, enum: [REQUIRES, EXCLUDES] }
        subjectOfferingId: { type: string, format: uuid }
        subjectName: { type: string }
        otherSubjectOfferingId: { type: string, format: uuid }
        otherSubjectName: { type: string }
        summary: { type: string, example: Physics requires Mathematics }
    Programme:
      type: object
      properties:
        programmeId: { type: string, format: uuid }
        academicSessionId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        kind: { type: string, enum: [STREAM, FLEXIBLE] }
        gradeFromId: { type: string, format: uuid }
        gradeToId: { type: string, format: uuid }
        boardId: { type: string, format: uuid, nullable: true }
        subjectRules:
          type: array
          items:
            type: object
            properties:
              subjectOfferingId: { type: string, format: uuid }
              subjectCode: { type: string }
              subjectName: { type: string }
              requirement: { type: string, enum: [REQUIRED, CHOICE, OPTIONAL] }
              status: { type: string, enum: [ACTIVE, INACTIVE] }
        choiceMin: { type: integer, nullable: true }
        choiceMax: { type: integer, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    ValidationResult:
      type: object
      properties:
        academicSessionId: { type: string, format: uuid }
        validatedAt: { type: string, format: date-time }
        summary: { type: object, properties: { errors: { type: integer }, warnings: { type: integer }, info: { type: integer } } }
        canPublish: { type: boolean }
        issues:
          type: array
          items:
            type: object
            properties:
              level: { type: string, enum: [ERROR, WARNING, INFO] }
              code: { type: string, example: GROUP_MIN_EXCEEDS_ELIGIBLE }
              message: { type: string }
              entityType: { type: string }
              entityId: { type: string }
    AcademicOverview:
      type: object
      properties:
        academicSessionId: { type: string, format: uuid }
        status: { type: string }
        counts: { type: object }
        boards: { type: array, items: { type: object } }
        checklist:
          type: array
          items:
            type: object
            properties:
              key: { type: string, enum: [session, board, grades, sections, subjects, rules, terms, validation] }
              label: { type: string }
              status: { type: string, enum: [completed, pending, optional] }
              detail: { type: string }
        lastValidation: { type: object, nullable: true }
    AcademicContext:
      type: object
      description: Frozen. Without `gradeId` only `grades` is returned; with it, the full tree below.
      properties:
        academicSessionId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        sessionStatus: { type: string }
        board: { type: object }
        grades: { type: array, items: { $ref: '#/components/schemas/GradeOffering' } }
        gradeOffering: { $ref: '#/components/schemas/GradeOffering' }
        sections: { type: array, items: { $ref: '#/components/schemas/SectionOffering' } }
        subjectOfferings: { type: array, items: { $ref: '#/components/schemas/SubjectOffering' } }
        choiceGroups: { type: array, items: { $ref: '#/components/schemas/ChoiceGroup' } }
        constraints: { type: array, items: { $ref: '#/components/schemas/Constraint' } }
        programmes: { type: array, items: { $ref: '#/components/schemas/Programme' } }
        terms: { type: array, items: { $ref: '#/components/schemas/Term' } }
    CreateBoard:
      type: object
      required: [boardCode, boardName]
      properties:
        boardCode: { type: string, example: HSB }
        boardName: { type: string }
        boardType: { type: string, enum: [CENTRAL, STATE, OTHER] }
        stateCode: { type: string }
    CreateRuleVersion:
      type: object
      required: [name]
      properties:
        name: { type: string, example: 2027-28 }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        sourceReference: { type: string }
    CreateSubject:
      type: object
      required: [subjectCode, name, category]
      properties:
        subjectCode: { type: string, example: MATH }
        name: { type: string }
        shortName: { type: string }
        category: { type: string }
        languageCode: { type: string }
        hasTheory: { type: boolean }
        hasPractical: { type: boolean }
        hasProject: { type: boolean }
        hasInternalAssessment: { type: boolean }
    UpdateSubject:
      type: object
      description: Any subset of the CreateSubject fields plus `status`.
      properties:
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    SetBoardCode:
      type: object
      required: [boardRuleVersionId, boardSubjectCode]
      properties:
        boardRuleVersionId: { type: string, format: uuid }
        boardSubjectCode: { type: string, example: "041" }
        boardSubjectName: { type: string }
    CreateSession:
      type: object
      required: [name, code, startDate, endDate]
      properties:
        name: { type: string }
        code: { type: string, example: 2026-27 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        locations:
              type: array
              items:
                type: object
                required: [locationId, boardId, boardRuleVersionId]
                properties:
                  locationId: { type: string, format: uuid }
                  boardId: { type: string, format: uuid }
                  boardRuleVersionId: { type: string, format: uuid }
                  affiliationNumber: { type: string }
    UpdateSession:
      type: object
      description: Any subset. `locations` replaces the list; the code and status cannot be changed here.
      properties:
        name: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        locations:
              type: array
              items:
                type: object
                required: [locationId, boardId, boardRuleVersionId]
                properties:
                  locationId: { type: string, format: uuid }
                  boardId: { type: string, format: uuid }
                  boardRuleVersionId: { type: string, format: uuid }
                  affiliationNumber: { type: string }
    CloneSession:
      type: object
      required: [name, code, startDate, endDate]
      properties:
        name: { type: string }
        code: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    CreateGradeOfferings:
      type: object
      required: [locationId, gradeIds]
      properties:
        locationId: { type: string, format: uuid }
        gradeIds: { type: array, items: { type: string, format: uuid } }
        medium: { type: string }
    UpdateGradeOffering:
      type: object
      properties:
        displayName: { type: string }
        displayCode: { type: string }
        medium: { type: string, nullable: true }
        capacity: { type: integer, nullable: true }
        sequenceOrder: { type: integer }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    CreateSections:
      type: object
      required: [codes]
      properties:
        codes: { type: array, items: { type: string }, example: [A, B, C] }
        capacity: { type: integer }
    UpdateSection:
      type: object
      properties:
        displayName: { type: string }
        capacity: { type: integer, nullable: true }
        sequenceOrder: { type: integer }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    CreateSubjectOfferings:
      type: object
      required: [subjectIds, offeringType]
      properties:
        subjectIds: { type: array, items: { type: string, format: uuid } }
        offeringType: { type: string, enum: [MANDATORY, ELECTIVE, OPTIONAL_ADDITIONAL, LANGUAGE, SKILL, INTERNAL] }
    UpdateSubjectOffering:
      type: object
      properties:
        offeringType: { type: string }
        boardSubjectDefinitionId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    CreateTerm:
      type: object
      required: [name, code, startDate, endDate]
      properties:
        name: { type: string }
        code: { type: string, example: T1 }
        type: { type: string, enum: [TERM, SEMESTER, QUARTER, ANNUAL, CUSTOM] }
        locationId: { type: string, format: uuid, nullable: true }
        sequence: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    UpdateTerm:
      type: object
      description: Any subset of the CreateTerm fields.
      properties:
        name: { type: string }
    CreateChoiceGroup:
      type: object
      required: [name, ruleType, subjectOfferingIds]
      properties:
        name: { type: string, example: Language 1 }
        ruleType: { type: string, enum: [REQUIRED_ALL, CHOOSE_ONE, CHOOSE_N, OPTIONAL] }
        min: { type: integer, description: CHOOSE_N only }
        max: { type: integer, description: CHOOSE_N and OPTIONAL }
        sequence: { type: integer }
        subjectOfferingIds: { type: array, items: { type: string, format: uuid } }
    UpdateChoiceGroup:
      type: object
      description: Any subset of the CreateChoiceGroup fields plus `status`.
      properties:
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    CreateConstraint:
      type: object
      required: [type, subjectOfferingId, otherSubjectOfferingId]
      properties:
        type: { type: string, enum: [REQUIRES, EXCLUDES] }
        subjectOfferingId: { type: string, format: uuid }
        otherSubjectOfferingId: { type: string, format: uuid }
    CreateProgramme:
      type: object
      required: [academicSessionId, locationId, name, code, kind, gradeFromId, gradeToId]
      properties:
        academicSessionId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        kind: { type: string, enum: [STREAM, FLEXIBLE] }
        gradeFromId: { type: string, format: uuid }
        gradeToId: { type: string, format: uuid }
        boardId: { type: string, format: uuid, nullable: true }
        subjectRules: { type: array, items: { type: object, properties: { subjectOfferingId: { type: string, format: uuid }, requirement: { type: string, enum: [REQUIRED, CHOICE, OPTIONAL] } } } }
        choiceMin: { type: integer }
        choiceMax: { type: integer }
    UpdateProgramme:
      type: object
      description: Any subset of the CreateProgramme fields (except session, location and code) plus `status`.
      properties:
        status: { type: string, enum: [ACTIVE, INACTIVE] }
